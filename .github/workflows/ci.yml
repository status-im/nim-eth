name: CI
on:
  push:
    branches:
      - master
      - test-minver
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@minver
    with:
      install-command: 'nimble --resolver:minver install -y --depsOnly'
      nim-versions: '["version-2-0", "version-2-2", "version-2-4", "devel"]'
      test-command: |
        nimble test
        nimble build_dcli
        nimble build_fuzzers
